name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the steps in the hardened js-ci-runner image: Node.js 24 on Alpine, non-root (UID 1001).
    # :0.1 follows patch releases. https://github.com/yi-john-huang/js-ci-runner
    container: ghcr.io/yi-john-huang/js-ci-runner/ci:0.1
    steps:
      - uses: actions/checkout@v4
      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: node --version && id
      - run: npm ci
      - run: npm run build
      - run: npm test
