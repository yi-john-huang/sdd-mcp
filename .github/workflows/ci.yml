name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on the maintainer's local self-hosted runners (label `sdd-mcp`):
# a macOS host and a Lima Linux VM on it. Pull requests from forks never run here
# unless a maintainer approves them (repository setting: all external contributors).
jobs:
  test-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, sdd-mcp]
    steps:
      - uses: actions/checkout@v4
      # Build and test in the hardened js-ci-runner image (Node.js 24 on Alpine).
      # :0.1 follows patch releases. https://github.com/yi-john-huang/js-ci-runner
      # A job-level `container:` cannot be used: JavaScript actions such as checkout do not run
      # in Alpine containers on ARM64 runners. The image runs as the runner's own non-root user
      # so the files it writes in the workspace stay removable by the next checkout. `--init` adds a
      # PID 1 that reaps orphans; without it, killed grandchildren stay zombies and the process-tree
      # kill test sees them as alive.
      - name: Build and test in the js-ci-runner image
        run: |
          mkdir -p "$HOME/.cache/sdd-mcp-npm"
          docker run --rm --init --pull always \
            --user "$(id -u):$(id -g)" -e HOME=/tmp/home -e CI=true \
            -v "$PWD:/work" -w /work \
            -v "$HOME/.cache/sdd-mcp-npm:/tmp/home/.npm" \
            ghcr.io/yi-john-huang/js-ci-runner/ci:0.1 \
            sh -c 'node --version && id && npm ci && npm run build && npm test'

  test-macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, sdd-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --version && id
      - run: npm ci
      - run: npm run build
      - run: npm test
