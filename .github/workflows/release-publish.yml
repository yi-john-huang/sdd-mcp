name: Release publish

# After a merge to master, publish the version in package.json to npm,
# then create its tag and GitHub Release. Each step skips work that is already done,
# so a rerun after a partial failure is safe.
on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Read the release state
        id: state
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "sdd-mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.state.outputs.published == 'false' || steps.state.outputs.tagged == 'false'
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish to npm
        if: steps.state.outputs.published == 'false'
        run: npm publish --access public --provenance

      - name: Create the tag and GitHub Release
        if: steps.state.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          node scripts/release.mjs notes --version "$VERSION" > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.state.outputs.version }}
          TAGGED: ${{ steps.state.outputs.tagged }}
          PUBLISHED: ${{ steps.state.outputs.published }}
        run: |
          if [ "$TAGGED" = "true" ] && [ "$PUBLISHED" = "true" ]; then
            echo "v$VERSION is already tagged and published. Nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released v$VERSION to npm and GitHub." >> "$GITHUB_STEP_SUMMARY"
          fi
